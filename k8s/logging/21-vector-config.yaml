---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: logging
data:
  vector.yaml: |
    data_dir: /vector-data-dir

    sources:
      kubernetes:
        type: kubernetes_logs
        extra_field_selector: metadata.namespace=sentinel

    transforms:
      normalize:
        type: remap
        inputs: [kubernetes]
        source: |
          .namespace = .kubernetes.pod_namespace
          .pod = .kubernetes.pod_name
          .container = .kubernetes.container_name
          .node = .kubernetes.pod_node_name

          del(.kubernetes)
          del(.file)
          del(.source_type)

          parsed, err = parse_json(.message)
          if err == null && is_object(parsed) {
            . = merge(., object!(parsed), deep: true)
          }

          if !exists(."service.name") {
            ."service.name" = .container
          }

          if !exists(.level) {
            .level = "info"
          }

    sinks:
      victoria_logs:
        type: http
        inputs: [normalize]
        uri: http://victoria-logs.logging.svc.cluster.local:9428/insert/jsonline?_msg_field=message&_time_field=timestamp&_stream_fields=namespace,pod,container
        method: post
        encoding:
          codec: json
        framing:
          method: newline_delimited
        healthcheck:
          enabled: false
        batch:
          max_events: 1000
          timeout_secs: 2
...
