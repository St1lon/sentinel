---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-logs-data
  namespace: logging
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
...
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: logging
spec:
  type: ClusterIP
  selector:
    app: victoria-logs
  ports:
  - port: 9428
    targetPort: http
    name: http
...
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-logs
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: victoria-logs
    spec:
      containers:
      - image: victoriametrics/victoria-logs:v1.40.0
        name: victoria-logs
        imagePullPolicy: IfNotPresent
        args:
        - -storageDataPath=/vlogs
        - -retentionPeriod=7d
        - -httpListenAddr=:9428
        ports:
        - containerPort: 9428
          name: http
        volumeMounts:
        - name: data
          mountPath: /vlogs
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: victoria-logs-data
...
