---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup
  namespace: sentinel
spec:
  schedule: "0 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: cleanup
        spec:
          restartPolicy: OnFailure
          containers:
          - image: sentinel/cleanup:dev
            name: cleanup
            imagePullPolicy: IfNotPresent
            envFrom:
            - configMapRef:
                name: sentinel-config
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: DATABASE_URL
            resources:
              requests:
                cpu: 20m
                memory: 32Mi
              limits:
                memory: 64Mi
...
