---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sentinel
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
  - port: 8080
    targetPort: http
    name: http
...
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
      - image: postgres:17.11-alpine
        name: wait-for-schema
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - until psql "$DATABASE_URL" -c 'SELECT 1 FROM monitors LIMIT 1' >/dev/null 2>&1; do sleep 2; done
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: DATABASE_URL
      containers:
      - image: sentinel/api:dev
        name: api
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: sentinel-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: DATABASE_URL
        - name: AUTH_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: AUTH_JWT_SECRET
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
      terminationGracePeriodSeconds: 20
...
