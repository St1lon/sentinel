---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    route:
      receiver: sink
      group_by: [alertname, severity]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 3h

      routes:
      - matchers: [severity="critical"]
        receiver: sink
      - matchers: [severity="warning"]
        receiver: sink

    receivers:
    - name: sink
      webhook_configs:
      - url: http://notifier-sink.monitoring.svc.cluster.local:8080/alert
        send_resolved: true

    inhibit_rules:
    - source_matchers: ['alertname = SentinelAPIHighErrorRate']
      target_matchers: ['alertname = SentinelAPIHighLatencyP95']
      equal: [service]
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
  - port: 9093
    targetPort: http
    name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - image: prom/alertmanager:v0.28.1
        name: alertmanager
        imagePullPolicy: IfNotPresent
        args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        - --web.listen-address=:9093
        ports:
        - containerPort: 9093
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
          readOnly: true
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          initialDelaySeconds: 5
          periodSeconds: 15
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: alertmanager-config