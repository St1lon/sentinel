---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sli-rules
  namespace: monitoring
data:
  sentinel-sli.yaml: |
    groups:
      - name: sentinel-sli
        interval: 30s
        rules:
          - record: sentinel:slo_target:ratio
            expr: vector(0.995)
            labels:
              slo: availability
          - record: sentinel:slo_target:ratio
            expr: vector(0.95)
            labels:
              slo: latency
          - record: sentinel:slo_target:ratio
            expr: vector(0.99)
            labels:
              slo: pipeline

          - record: sentinel:sli:ratio5m
            expr: |
              sum(rate(sentinel_http_requests_total{service="sentinel-api",route!~"/healthz|/readyz|unmatched",status!~"5.."}[5m]))
              /
              sum(rate(sentinel_http_requests_total{service="sentinel-api",route!~"/healthz|/readyz|unmatched"}[5m]))
            labels:
              slo: availability

          - record: sentinel:sli:ratio5m
            expr: |
              sum(rate(sentinel_http_request_duration_seconds_bucket{service="sentinel-api",route!~"/healthz|/readyz",le="0.3"}[5m]))
              /
              sum(rate(sentinel_http_request_duration_seconds_count{service="sentinel-api",route!~"/healthz|/readyz"}[5m]))
            labels:
              slo: latency

          - record: sentinel:sli:ratio5m
            expr: avg_over_time(((sum(rate(sentinel_probes_total[2m])) or vector(0)) > bool 0)[5m:1m])
            labels:
              slo: pipeline

          - record: sentinel:sli:ratio5m
            expr: avg_over_time(max(sentinel_sli_journey_success)[5m:1m])
            labels:
              slo: journey

          - record: sentinel:burn_rate:ratio5m
            expr: (1 - sentinel:sli:ratio5m) / (1 - sentinel:slo_target:ratio)

          - record: sentinel:sli:ratio1h
            expr: |
              sum(rate(sentinel_http_requests_total{service="sentinel-api",route!~"/healthz|/readyz|unmatched",status!~"5.."}[1h]))
              /
              sum(rate(sentinel_http_requests_total{service="sentinel-api",route!~"/healthz|/readyz|unmatched"}[1h]))
            labels:
              slo: availability
          - record: sentinel:sli:ratio1h
            expr: |
              sum(rate(sentinel_http_request_duration_seconds_bucket{service="sentinel-api",route!~"/healthz|/readyz",le="0.3"}[1h]))
              /
              sum(rate(sentinel_http_request_duration_seconds_count{service="sentinel-api",route!~"/healthz|/readyz"}[1h]))
            labels:
              slo: latency
          - record: sentinel:sli:ratio1h
            expr: avg_over_time(sentinel:sli:ratio5m{slo="pipeline"}[1h])
            labels:
              slo: pipeline

          - record: sentinel:burn_rate:ratio1h
            expr: (1 - sentinel:sli:ratio1h) / (1 - sentinel:slo_target:ratio)

      - name: sentinel-slo
        interval: 1m
        rules:
          - record: sentinel:sli:ratio6h
            expr: |
              sum(rate(sentinel_http_requests_total{service="sentinel-api",route!~"/healthz|/readyz|unmatched",status!~"5.."}[6h]))
              /
              sum(rate(sentinel_http_requests_total{service="sentinel-api",route!~"/healthz|/readyz|unmatched"}[6h]))
            labels:
              slo: availability
          - record: sentinel:sli:ratio6h
            expr: |
              sum(rate(sentinel_http_request_duration_seconds_bucket{service="sentinel-api",route!~"/healthz|/readyz",le="0.3"}[6h]))
              /
              sum(rate(sentinel_http_request_duration_seconds_count{service="sentinel-api",route!~"/healthz|/readyz"}[6h]))
            labels:
              slo: latency
          - record: sentinel:sli:ratio6h
            expr: avg_over_time(sentinel:sli:ratio5m{slo="pipeline"}[6h])
            labels:
              slo: pipeline

          - record: sentinel:burn_rate:ratio6h
            expr: (1 - sentinel:sli:ratio6h) / (1 - sentinel:slo_target:ratio)

          - record: sentinel:sli:ratio30d
            expr: |
              sum(increase(sentinel_http_requests_total{service="sentinel-api",route!~"/healthz|/readyz|unmatched",status!~"5.."}[30d]))
              /
              sum(increase(sentinel_http_requests_total{service="sentinel-api",route!~"/healthz|/readyz|unmatched"}[30d]))
            labels:
              slo: availability
          - record: sentinel:sli:ratio30d
            expr: |
              sum(increase(sentinel_http_request_duration_seconds_bucket{service="sentinel-api",route!~"/healthz|/readyz",le="0.3"}[30d]))
              /
              sum(increase(sentinel_http_request_duration_seconds_count{service="sentinel-api",route!~"/healthz|/readyz"}[30d]))
            labels:
              slo: latency
          - record: sentinel:sli:ratio30d
            expr: avg_over_time(sentinel:sli:ratio5m{slo="pipeline"}[30d])
            labels:
              slo: pipeline

          - record: sentinel:error_budget_remaining:ratio30d
            expr: 1 - (1 - sentinel:sli:ratio30d) / (1 - sentinel:slo_target:ratio)

          - record: sentinel:sla_compound:ratio30d
            expr: exp(sum(ln(sentinel:sli:ratio30d)))