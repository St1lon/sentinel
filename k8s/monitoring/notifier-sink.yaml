---
apiVersion: v1
kind: Service
metadata:
  name: notifier-sink
  namespace: monitoring
spec:
  selector:
    app: notifier-sink
  ports:
  - port: 8080
    targetPort: http
    name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier-sink
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifier-sink
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: notifier-sink
    spec:
      containers:
      - image: sentinel/notifier-sink:dev
        name: notifier-sink
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 15
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
      terminationGracePeriodSeconds: 10