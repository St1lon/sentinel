---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prober
  namespace: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prober
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: prober
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - image: sentinel/prober:dev
        name: prober
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9090
          name: metrics
        envFrom:
        - configMapRef:
            name: sentinel-config
        env:
        - name: PROBER_LOGIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: PROBER_LOGIN_PASSWORD
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 64Mi
      terminationGracePeriodSeconds: 10