openapi: 3.0.3

info:
  title: Sentinel API
  version: 1.0.0
  description: |
    HTTP API сервиса мониторинга доступности.

    Контракт — источник истины для клиентов: фронтенд и интеграции опираются
    на него, а не на реализацию. Все ошибки имеют единый формат
    `{code, description}`; клиент принимает решения по `code`, а не по тексту.

servers:
  - url: http://localhost:8080
    description: через nginx (фронтенд и API на одном origin)
  - url: http://localhost:8081
    description: напрямую в процесс api

tags:
  - name: auth
    description: Регистрация и вход
  - name: monitors
    description: CRUD над мониторами
  - name: observability
    description: Статистика, проверки и инциденты
  - name: public
    description: Публичная статус-страница
  - name: system
    description: Технические эндпоинты

paths:
  /healthz:
    get:
      tags: [system]
      summary: Процесс жив
      description: Не проверяет присоединённые ресурсы — только то, что процесс отвечает.
      responses:
        '200':
          description: Процесс отвечает
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /readyz:
    get:
      tags: [system]
      summary: Процесс готов принимать трафик
      description: Проверяет доступность PostgreSQL. Этот эндпоинт опрашивает балансировщик.
      responses:
        '200':
          description: Готов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: БД недоступна
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Зарегистрировать пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Пользователь создан, токен выдан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email уже занят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Войти
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Токен выдан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me:
    get:
      tags: [auth]
      summary: Текущий пользователь
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/monitors:
    get:
      tags: [monitors]
      summary: Список мониторов
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Страница мониторов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitorList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [monitors]
      summary: Создать монитор
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMonitor' }
      responses:
        '201':
          description: Монитор создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Монитор с таким названием уже есть
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/monitors/{monitorID}:
    parameters:
      - $ref: '#/components/parameters/MonitorID'
    get:
      tags: [monitors]
      summary: Получить монитор
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Монитор
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [monitors]
      summary: Изменить монитор
      description: Частичное обновление: передаются только изменяемые поля.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMonitor' }
      responses:
        '200':
          description: Монитор обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [monitors]
      summary: Удалить монитор
      description: Вместе с монитором каскадно удаляются его проверки и инциденты.
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Удалён
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/monitors/{monitorID}/stats:
    parameters:
      - $ref: '#/components/parameters/MonitorID'
    get:
      tags: [observability]
      summary: Статистика монитора за период
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: bucket, in: query, schema: { type: string, enum: [hour, day], default: hour } }
      responses:
        '200':
          description: Агрегат и корзины для графика
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitorStats' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/monitors/{monitorID}/checks:
    parameters:
      - $ref: '#/components/parameters/MonitorID'
    get:
      tags: [observability]
      summary: Последние проверки монитора
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Проверки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckList' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/monitors/{monitorID}/incidents:
    parameters:
      - $ref: '#/components/parameters/MonitorID'
    get:
      tags: [observability]
      summary: История инцидентов монитора
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Инциденты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentList' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/public/status/{slug}:
    get:
      tags: [public]
      summary: Публичная статус-страница
      description: |
        Доступна без авторизации: доступ даёт знание слага, который выдаётся
        при регистрации и непредсказуем. URL целей здесь не отдаётся намеренно.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Статус-страница
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusPage' }
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MonitorID:
      name: monitorID
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Требуется действующий токен
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, description]
      properties:
        code:
          type: string
          example: MONITOR_NOT_FOUND
          description: Машиночитаемый код ошибки в SCREAMING_SNAKE_CASE.
        description:
          type: string
          example: monitor not found

    Health:
      type: object
      required: [status, version, env]
      properties:
        status: { type: string, example: ok }
        version: { type: string, example: 1.0.0 }
        env: { type: string, example: development }

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }

    User:
      type: object
      required: [id, email, status_page_slug, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status_page_slug:
          type: string
          description: Слаг публичной статус-страницы.
        created_at: { type: string, format: date-time }

    AuthResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }

    MonitorKind:
      type: string
      enum: [http, tls_cert, tcp_port]
      default: http
      description: |
        Вид проверки. В текущей сборке реализован только `http`;
        остальные значения зарезервированы в схеме БД под следующие этапы.

    MonitorStatus:
      type: string
      enum: [pending, up, down, paused]

    CreateMonitor:
      type: object
      required: [name, target]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        target:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Абсолютный URL со схемой http или https. Приватные, loopback
            и служебные адреса отклоняются (защита от SSRF).
        kind: { $ref: '#/components/schemas/MonitorKind' }
        method: { type: string, enum: [GET, HEAD, OPTIONS], default: GET }
        interval_seconds: { type: integer, minimum: 10, maximum: 86400, default: 60 }
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 120
          default: 10
          description: Должен быть строго меньше interval_seconds.
        expected_status: { type: integer, minimum: 100, maximum: 599, default: 200 }
        failure_threshold:
          type: integer
          minimum: 1
          maximum: 10
          default: 2
          description: Сколько подряд неудачных проверок открывает инцидент.
        is_public: { type: boolean, default: false }
        paused: { type: boolean, default: false }

    UpdateMonitor:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        target: { type: string, format: uri }
        method: { type: string, enum: [GET, HEAD, OPTIONS] }
        interval_seconds: { type: integer, minimum: 10, maximum: 86400 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 120 }
        expected_status: { type: integer, minimum: 100, maximum: 599 }
        failure_threshold: { type: integer, minimum: 1, maximum: 10 }
        is_public: { type: boolean }
        paused: { type: boolean }

    Monitor:
      type: object
      required:
        [id, name, kind, target, method, interval_seconds, timeout_seconds,
         expected_status, failure_threshold, is_public, paused, status,
         consecutive_failures, next_check_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/MonitorKind' }
        target: { type: string }
        method: { type: string }
        interval_seconds: { type: integer }
        timeout_seconds: { type: integer }
        expected_status: { type: integer }
        failure_threshold: { type: integer }
        is_public: { type: boolean }
        paused: { type: boolean }
        status: { $ref: '#/components/schemas/MonitorStatus' }
        consecutive_failures: { type: integer }
        last_checked_at: { type: string, format: date-time, nullable: true }
        next_check_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MonitorList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Monitor' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    Check:
      type: object
      required: [id, checked_at, up, latency_ms]
      properties:
        id: { type: integer, format: int64 }
        checked_at: { type: string, format: date-time }
        up: { type: boolean }
        status_code: { type: integer, nullable: true }
        latency_ms: { type: integer }
        error: { type: string, nullable: true }

    CheckList:
      type: object
      required: [monitor_id, items]
      properties:
        monitor_id: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/Check' }

    Bucket:
      type: object
      required: [bucket, total, successful, uptime_ratio]
      properties:
        bucket: { type: string, format: date-time }
        total: { type: integer }
        successful: { type: integer }
        uptime_ratio: { type: number, format: double, minimum: 0, maximum: 1 }

    MonitorStats:
      type: object
      required:
        [monitor_id, from, to, total_checks, successful_checks, uptime_ratio,
         avg_latency_ms, p95_latency_ms, buckets]
      properties:
        monitor_id: { type: string, format: uuid }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        total_checks: { type: integer }
        successful_checks: { type: integer }
        uptime_ratio: { type: number, format: double }
        avg_latency_ms: { type: number, format: double }
        p95_latency_ms: { type: integer }
        last_checked_at: { type: string, format: date-time, nullable: true }
        buckets:
          type: array
          items: { $ref: '#/components/schemas/Bucket' }

    Incident:
      type: object
      required: [id, monitor_id, started_at, cause, is_open, duration_seconds]
      properties:
        id: { type: string, format: uuid }
        monitor_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        cause: { type: string }
        is_open: { type: boolean }
        duration_seconds: { type: integer, format: int64 }

    IncidentList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Incident' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    StatusPage:
      type: object
      required: [from, to, overall, services, incidents]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        overall:
          type: string
          enum: [operational, degraded, down, unknown]
        services:
          type: array
          items:
            type: object
            required: [name, status, uptime_ratio, buckets]
            properties:
              name: { type: string }
              status: { $ref: '#/components/schemas/MonitorStatus' }
              uptime_ratio: { type: number, format: double }
              last_check_at: { type: string, format: date-time, nullable: true }
              buckets:
                type: array
                items: { $ref: '#/components/schemas/Bucket' }
        incidents:
          type: array
          items:
            type: object
            required: [service, started_at, cause, duration_seconds]
            properties:
              service: { type: string }
              started_at: { type: string, format: date-time }
              resolved_at: { type: string, format: date-time, nullable: true }
              cause: { type: string }
              duration_seconds: { type: integer, format: int64 }
