# Окружение приложения: postgres, миграции, api, worker, web.
# Запуск: docker compose up --build -d

name: sentinel

x-database-url: &database-url >-
  postgres://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@postgres:5432/${POSTGRES_DB:-sentinel}?sslmode=disable

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  APP_VERSION: ${APP_VERSION:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-postgres-env: &postgres-env
  POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-10}
  POSTGRES_MIN_CONNS: ${POSTGRES_MIN_CONNS:-2}

x-schema-ready: &schema-ready
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

x-go-build: &go-build
  context: .
  dockerfile: deployments/Dockerfile

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [sentinel]
    restart: unless-stopped

  # Отдельный шаг до старта приложения, а не часть его запуска.
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./internal/infra/db/postgres/migrations:/migrations:ro
    command: ["-path=/migrations", "-database", *database-url, "up"]
    networks: [sentinel]
    restart: "no"

  api:
    build:
      <<: *go-build
      args:
        SERVICE: api
        VERSION: ${APP_VERSION:-dev}
    depends_on: *schema-ready
    environment:
      <<: [*app-env, *postgres-env]
      DATABASE_URL: *database-url
      HTTP_PORT: "8080"
      HTTP_CORS_ALLOWED_ORIGINS: ${HTTP_CORS_ALLOWED_ORIGINS:-*}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-15s}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required - run `make env` or `cp .env.example .env`}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-24h}
      AUTH_BCRYPT_COST: ${AUTH_BCRYPT_COST:-10}
    ports:
      - "${API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 20s
    <<: *hardening
    networks: [sentinel]
    restart: unless-stopped

  # Масштабируется горизонтально: docker compose up -d --scale worker=3
  worker:
    build:
      <<: *go-build
      args:
        SERVICE: worker
        VERSION: ${APP_VERSION:-dev}
    depends_on: *schema-ready
    environment:
      <<: [*app-env, *postgres-env]
      DATABASE_URL: *database-url
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-50}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1s}
      WORKER_SHUTDOWN_TIMEOUT: ${WORKER_SHUTDOWN_TIMEOUT:-30s}
      WORKER_USER_AGENT: ${WORKER_USER_AGENT:-SentinelUptimeBot/1.0}
      WORKER_MAX_RESPONSE_BYTES: ${WORKER_MAX_RESPONSE_BYTES:-65536}
      WORKER_MAX_REDIRECTS: ${WORKER_MAX_REDIRECTS:-3}
      WORKER_ALLOW_PRIVATE_TARGETS: ${WORKER_ALLOW_PRIVATE_TARGETS:-false}
    stop_grace_period: 35s
    <<: *hardening
    networks: [sentinel]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deployments/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    <<: *hardening
    networks: [sentinel]
    restart: unless-stopped

  # Разовый процесс: docker compose run --rm cleanup
  cleanup:
    build:
      <<: *go-build
      args:
        SERVICE: cleanup
        VERSION: ${APP_VERSION:-dev}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*app-env, *postgres-env]
      DATABASE_URL: *database-url
      RETENTION_CHECK_DAYS: ${RETENTION_CHECK_DAYS:-30}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-10000}
    <<: *hardening
    networks: [sentinel]
    restart: "no"

volumes:
  pgdata:

networks:
  sentinel:
    driver: bridge
